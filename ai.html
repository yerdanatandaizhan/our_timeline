<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Our Memories</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="memories-page">
    <!-- Navigation Bar -->
    <nav class="navbar">
      <a href="index.html" class="nav-link">🕰️Our Timeline</a>
      <a href="ai.html" class="nav-link active">🎞️Memories</a>
    </nav>

    <img src="images/timel.png" class="time_img" alt="" />
    <!-- Fun Fact Text -->
    <div class="fun-fact-container">
      <p class="fun-fact-text">
        Fun fact: я люблю собирать мини штуки которые мне напоминают о разных
        местах и событиях)
      </p>
    </div>
    <!-- AI POSTS CONTAINER -->
    <div id="ai-posts-container">
      <!-- ai-script.js will inject AI-related .post cards here -->
    </div>
    <img src="images/tr_arrow.png" class="arrow" alt="" />
    <!-- MUSIC PLAYER -->
    <div class="music-player">
      <audio id="audio" autoplay playsinline></audio>

      <div class="player-cover">
        <img id="cover" src="" alt="Album art" />
      </div>

      <div class="player-info">
        <div id="track-title">Title</div>
        <div id="track-artist">Artist</div>
        <div class="player-progress" id="progress-container">
          <div id="progress"></div>
        </div>
        <div class="time">
          <span id="current-time">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="player-controls">
        <button id="toggle" title="Play/Pause">▶︎</button>
        <button
          id="next"
          class="control-btn next-btn"
          title="Next track"
        ></button>
      </div>
    </div>
    <div id="hearts-container"></div>
    <!-- Fullscreen Modal -->
    <div id="fullscreen-modal" class="fullscreen-modal">
      <button class="close-btn" id="close-modal">×</button>
      <div class="fullscreen-content" id="fullscreen-content"></div>
    </div>
    <script src="ai-script.js"></script>
  </body>
</html>
